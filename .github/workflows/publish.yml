name: Publish pacman repo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Restore pacman repo cache
        uses: actions/cache@v4
        with:
          path: repo
          key: pacman-repo-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ hashFiles('Dockerfile', 'config/packages.local.txt', 'config/packages.upstream.txt', 'config/repo.env', 'pkgbuilds/**', 'scripts/build-local-packages.sh', 'scripts/compose-repo.sh', 'scripts/fetch-upstream.py', 'scripts/stage-pages.sh') }}
          restore-keys: |
            pacman-repo-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build builder image
        run: docker build -t pipa-pkgs-builder .

      - name: Build local packages
        run: |
          mkdir -p repo
          docker run --rm \
            -e LOCAL_BUILDER_ROOT=/work \
            -v "$PWD/repo:/repo" \
            -v "$PWD/config:/config" \
            -v "$PWD/pkgbuilds:/work/pkgbuilds" \
            pipa-pkgs-builder /usr/local/bin/build-local-packages.sh

      - name: Fix repo directory ownership
        run: sudo chown -R "$USER:$USER" .

      - name: Mirror upstream packages
        run: python scripts/fetch-upstream.py

      - name: Compose pacman repo
        run: |
          docker run --rm -v "$PWD:/work" -w /work pipa-pkgs-builder scripts/compose-repo.sh
          sudo chown -R "$USER:$USER" repo

      - name: Stage Pages content
        run: scripts/stage-pages.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
