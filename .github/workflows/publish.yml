name: Build & publish package repos

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  # ── Arch Linux (pacman) ──────────────────────────────────────────
  pacman:
    name: Build pacman packages
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Compute cache key
        id: cache-key
        run: |
          set -euo pipefail
          {
            printf '%s\0' \
              Dockerfile \
              config/packages.local.txt \
              config/packages.upstream.txt \
              config/repo.env \
              scripts/build-local-packages.sh \
              scripts/compose-repo.sh \
              scripts/fetch-upstream.py
            find common sm8250 -type f \
              ! -path '*/src/*' \
              ! -path '*/pkg/*' \
              -print0
          } | sort -z | xargs -0 sha256sum | sha256sum \
            | awk '{print "hash="$1}' >> "$GITHUB_OUTPUT"

      - name: Restore build cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            repo/repo/.build-cache
            repo/repo/*.pkg.tar.zst
            repo/repo/*.pkg.tar.xz
          key: pacman-${{ runner.arch }}-${{ github.ref_name }}-${{ steps.cache-key.outputs.hash }}
          restore-keys: pacman-${{ runner.arch }}-${{ github.ref_name }}-

      - name: Build builder image
        run: docker build -t pipa-pkgs-builder .

      - name: Build local packages
        run: |
          mkdir -p repo/repo/.build-cache
          docker run --rm \
            -e LOCAL_BUILDER_ROOT=/work \
            -v "$PWD/repo:/repo" \
            -v "$PWD/config:/config" \
            -v "$PWD/common:/work/common" \
            -v "$PWD/sm8250:/work/sm8250" \
            pipa-pkgs-builder /usr/local/bin/build-local-packages.sh

      - name: Fix ownership
        run: sudo chown -R "$USER:$USER" .

      - name: Save build cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            repo/repo/.build-cache
            repo/repo/*.pkg.tar.zst
            repo/repo/*.pkg.tar.xz
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Mirror upstream packages
        run: python scripts/fetch-upstream.py

      - name: Compose repo database
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            pipa-pkgs-builder scripts/compose-repo.sh
          sudo chown -R "$USER:$USER" repo

      - name: Sanitize filenames for artifact upload
        run: |
          cd repo/repo
          for f in *:*; do
            [ -e "$f" ] || continue
            mv "$f" "${f//:/%3A}"
          done

      - name: Upload pacman repo
        uses: actions/upload-artifact@v4
        with:
          name: pacman-repo
          path: repo/repo/
          retention-days: 1

  # ── Ultramarine / Fedora (RPM) ──────────────────────────────────
  ultramarine:
    name: Build Ultramarine RPMs
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Compute RPM cache key
        id: rpm-cache-key
        run: |
          set -euo pipefail
          {
            printf '%s\0' ultramarine/Dockerfile scripts/build-ultramarine-rpms.sh
            find ultramarine/specs -type f -print0
            find common sm8250 -type f \
              ! -path '*/src/*' \
              ! -path '*/pkg/*' \
              -print0
          } | sort -z | xargs -0 sha256sum | sha256sum \
            | awk '{print "hash="$1}' >> "$GITHUB_OUTPUT"

      - name: Restore RPM build cache
        id: rpm-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ultramarine/.build-cache
          key: rpm-${{ runner.arch }}-${{ github.ref_name }}-${{ steps.rpm-cache-key.outputs.hash }}
          restore-keys: rpm-${{ runner.arch }}-${{ github.ref_name }}-

      - name: Build RPM builder image
        run: docker build -t pipa-rpms-builder -f ultramarine/Dockerfile .

      - name: Build RPMs
        run: |
          mkdir -p repo/ultramarine
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            pipa-rpms-builder scripts/build-ultramarine-rpms.sh
          sudo chown -R "$USER:$USER" repo/ultramarine

      - name: Save RPM build cache
        if: steps.rpm-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ultramarine/.build-cache
          key: ${{ steps.rpm-cache-restore.outputs.cache-primary-key }}

      - name: Upload RPM repo
        uses: actions/upload-artifact@v4
        with:
          name: ultramarine-repo
          path: repo/ultramarine/
          retention-days: 1

  # ── Ubuntu (deb) ────────────────────────────────────────────────
  ubuntu:
    name: Build Ubuntu debs
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Compute deb cache key
        id: deb-cache-key
        run: |
          set -euo pipefail
          {
            printf '%s\0' ubuntu/Dockerfile scripts/build-ubuntu-debs.sh
            find ubuntu/packages -type f -print0
            find common sm8250 -type f \
              ! -path '*/src/*' \
              ! -path '*/pkg/*' \
              -print0
          } | sort -z | xargs -0 sha256sum | sha256sum \
            | awk '{print "hash="$1}' >> "$GITHUB_OUTPUT"

      - name: Restore deb build cache
        id: deb-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ubuntu/.build-cache
          key: deb-${{ runner.arch }}-${{ github.ref_name }}-${{ steps.deb-cache-key.outputs.hash }}
          restore-keys: deb-${{ runner.arch }}-${{ github.ref_name }}-

      - name: Build Ubuntu builder image
        run: docker build -t pipa-debs-builder -f ubuntu/Dockerfile .

      - name: Build debs
        run: |
          mkdir -p repo/ubuntu
          docker run --rm --privileged \
            -v "$PWD:/work" \
            -w /work \
            pipa-debs-builder scripts/build-ubuntu-debs.sh
          sudo chown -R "$USER:$USER" repo/ubuntu ubuntu/.build-cache || true

      - name: Save deb build cache
        if: steps.deb-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ubuntu/.build-cache
          key: ${{ steps.deb-cache-restore.outputs.cache-primary-key }}

      - name: Upload Ubuntu repo
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-repo
          path: repo/ubuntu/
          retention-days: 1

  # ── Deploy to GitHub Pages ──────────────────────────────────────
  deploy:
    name: Deploy to Pages
    needs: [pacman, ultramarine, ubuntu]
    runs-on: ubuntu-24.04-arm
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            config/
            scripts/

      - name: Download pacman repo
        uses: actions/download-artifact@v4
        with:
          name: pacman-repo
          path: repo/repo/

      - name: Restore epoch colons in pacman filenames
        run: |
          cd repo/repo
          for f in *%3A*; do
            [ -e "$f" ] || continue
            mv "$f" "${f//%3A/:}"
          done

      - name: Download RPM repo
        uses: actions/download-artifact@v4
        with:
          name: ultramarine-repo
          path: repo/ultramarine/

      - name: Download Ubuntu repo
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-repo
          path: repo/ubuntu/

      - uses: actions/configure-pages@v5

      - name: Stage Pages content
        run: scripts/stage-pages.sh

      # Re-running this job leaves a stale "github-pages" artifact from the
      # first attempt; deploy-pages rejects multiple artifacts with that name.
      - name: Delete stale Pages artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: github-pages
          failOnError: false

      - name: Upload Pages artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
