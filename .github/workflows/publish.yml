name: Publish pacman repo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build builder image
        run: docker build -t pipa-pkgs-builder .

      - name: Build local packages
        run: |
          mkdir -p repo
          docker run --rm \
            -e LOCAL_BUILDER_ROOT=/work \
            -v "$PWD/repo:/repo" \
            -v "$PWD/config:/config" \
            -v "$PWD/pkgbuilds:/work/pkgbuilds" \
            pipa-pkgs-builder /usr/local/bin/build-local-packages.sh

      - name: Fix repo directory ownership
        run: sudo chown -R "$USER:$USER" repo

      - name: Mirror upstream packages
        run: python scripts/fetch-upstream.py

      - name: Compose pacman repo
        run: scripts/compose-repo.sh

      - name: Stage Pages content
        run: scripts/stage-pages.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
